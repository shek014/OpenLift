name: Build

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Name the APK
        run: mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/openlift-debug-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: openlift-debug-apk
          path: app/build/outputs/apk/debug/openlift-debug-*.apk
          if-no-files-found: error
