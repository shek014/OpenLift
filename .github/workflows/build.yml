name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Android only installs an update signed with the same key as the app already on the phone,
      # so every build shares one key. Pull requests from forks can't read secrets, so they get a
      # throwaway key, which is fine because those builds aren't for updating anyone's phone.
      - name: Use the shared debug signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            # Say exactly where the key is. The build tools' default location varies by machine, and
            # if they don't find a key they quietly make a new one.
            key_folder="$RUNNER_TEMP/android"
            mkdir -p "$key_folder"
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$key_folder/debug.keystore"
            echo "ANDROID_USER_HOME=$key_folder" >> "$GITHUB_ENV"
          fi

      - name: Run tests and build debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Check the APK uses the shared key
        if: env.ANDROID_USER_HOME != ''
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          expected="$(keytool -list -v -keystore "$ANDROID_USER_HOME/debug.keystore" -storepass android -alias androiddebugkey \
            | sed -n 's/.*SHA256: //p' | tr -d ':' | tr 'A-F' 'a-f')"
          actual="$("$apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk \
            | sed -n 's/.*certificate SHA-256 digest: //p')"
          echo "Expected $expected"
          echo "Actual   $actual"
          [ -n "$expected" ] && [ "$expected" = "$actual" ]

      - name: Name the APK
        run: mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/openlift-debug-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: openlift-debug-apk
          path: app/build/outputs/apk/debug/openlift-debug-*.apk
          if-no-files-found: error
